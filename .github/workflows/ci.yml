name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Verify Contract Safety
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v5

      - name: 2. Setup pnpm
        uses: pnpm/action-setup@v5

      - name: 3. Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: 4. Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. Check TypeScript types
        run: pnpm typecheck

      - name: 6. Check ESLint
        run: pnpm lint

      - name: 7. Build all projects
        run: pnpm build

      - name: 8. Verify API contract is up to date
        # openapi.json и клиент Orval пересоздаются без запуска сервера.
        # Если файлы в git отличаются от свежих — их забыли пересоздать и закоммитить.
        run: |
          pnpm --filter api openapi
          pnpm --filter web generate-api

          if [ -n "$(git status --porcelain apps/api/openapi.json apps/web/src/shared/api/generated)" ]; then
            echo "❌ ERROR: openapi.json or the Orval client is out of date."
            echo "Run 'pnpm --filter api openapi && pnpm --filter web generate-api' and commit the changes."
            git status --porcelain apps/api/openapi.json apps/web/src/shared/api/generated
            exit 1
          else
            echo "✅ openapi.json and the Orval client are up to date."
          fi
