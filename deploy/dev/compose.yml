name: messenger-dev

services:
  postgres:
    image: postgres:18.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  redis:
    image: redis:8.10.3-trixie
    restart: unless-stopped
    command:
      [redis-server, --appendonly, "yes", --appendfsync, everysec, --save, ""]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'test "$$(redis-cli ping)" = PONG']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  api:
    # Use the API image tagged with the deployed commit SHA.
    image: "${API_IMAGE:?required}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  nginx:
    image: nginx:1.30.8-alpine3.24
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^API_DOMAIN$
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ${TLS_CERTS_DIR:?Set TLS_CERTS_DIR to the absolute certificate directory}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
