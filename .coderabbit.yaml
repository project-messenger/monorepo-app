# Настройки ИИ-ревью CodeRabbit для всего монорепо.
# Справочник ключей: https://docs.coderabbit.ai/reference/configuration
#
# Правила кода здесь не дублируем: CodeRabbit сам читает AGENTS.md (и CLAUDE.md,
# .cursorrules и т.п.). Корневой AGENTS.md действует на всё монорепо, вложенный — на свою
# папку: apps/web/AGENTS.md — на apps/web/**, apps/api/AGENTS.md — на apps/api/**,
# packages/shared/AGENTS.md — на packages/shared/**.
#
# Конфиг берётся из ветки PR: изменения этого файла видны сразу в том же PR.

language: ru-RU

tone_instructions: >-
  Пиши кратко и по делу. В начале замечания помечай важность: баг, безопасность,
  производительность, стиль. В команде есть junior-разработчики: объясняй, почему это важно.

reviews:
  # chill — меньше придирок к стилю; assertive — больше замечаний.
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    # Черновики (draft PR) не ревьюим — CodeRabbit подключится, когда PR отметят готовым.
    drafts: false

  # По умолчанию CodeRabbit уже пропускает node_modules, .next, dist, pnpm-lock.yaml,
  # **/generated/** (клиент Orval) и т.п. Здесь — только то, чего нет в его списке.
  path_filters:
    - "!**/*.tsbuildinfo"

  # Что проверять в ревью сверх правил из AGENTS.md.
  path_instructions:
    - path: "apps/web/**"
      instructions: |
        Фронтенд: Next.js 16 (App Router, Cache Components), React 19, Zod 4, TanStack Query v5, MSW 3.
        Не предлагай API старых версий (Zod 3, MSW 2, forwardRef и т.п.).
        Особое внимание:
        - FSD: слой импортирует только из слоёв ниже, снаружи слайса — только через его index.ts.
        - Дизайн-система: только семантические Tailwind-классы из токенов, без произвольных цветов.
        - Новая логика покрыта тестом рядом с кодом (*.test.ts(x)).
        - Новые зависимости в package.json — спроси в PR, зачем они нужны.
        - Безопасность: токены и секреты не попадают в клиентский код, NEXT_PUBLIC_* без секретов,
          redirect-параметры проверяются (open redirect).
        Блоки <!-- BEGIN:nextjs-… --> в apps/web/AGENTS.md генерирует next dev — не предлагай их менять.
    - path: "apps/api/**"
      instructions: |
        Бэкенд: NestJS 12 (ESM — относительные импорты с .js), Vitest. Не предлагай CommonJS и API старых версий.
        Особое внимание:
        - Права доступа проверяются на сервере в каждом эндпоинте и WebSocket-событии (участник пространства,
          проекта, закрытого канала). Скрытая кнопка на фронтенде — не защита.
        - Входные данные валидируются схемой, а не вручную в контроллере. Контроллер тонкий, логика — в сервисе.
        - Наружу не отдаются модели БД целиком: только DTO без служебных полей (хэши паролей, токены, внутренние id).
        - Токены интеграций и содержимое приватных переписок не попадают в логи и ответы.
        - Повторная доставка webhook и повторная отправка сообщения не создают дублей (идемпотентность).
        - Тяжёлые операции (файлы, ИИ, индексация) — в фоновых задачах, а не в обработчике запроса.
        - Новый эндпоинт покрыт e2e-тестом, новая логика сервиса — unit-тестом рядом (*.spec.ts).
        - Новые зависимости в package.json — спроси в PR, зачем они нужны.
    - path: "packages/shared/**"
      instructions: |
        Общий пакет фронтенда и бэкенда: события WebSocket (названия и Zod-схемы данных) и общие константы.
        HTTP-схем запросов и ответов здесь быть не должно — их описывает бэкенд (OpenAPI), а фронтенд получает от Orval.
        Изменение события ломает обе стороны: проверь, что в PR обновлены apps/web и apps/api,
        и укажи, если изменение несовместимо назад.

chat:
  # Отвечать на ответы в комментариях без упоминания бота.
  auto_reply: true
