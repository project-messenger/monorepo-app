services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  redis:
    image: redis:8.10.3-trixie
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--save",
        "",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli ping)" = PONG']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.34.0
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: /mailpit readyz
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    environment:
      # Письма хранятся в volume, чтобы после перезапуска открыть ссылку из старого письма.
      # Старые письма удаляются, когда их больше лимита.
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      # Принимать любой логин и пароль SMTP без TLS: приложение отправляет письма так же, как в проде,
      # меняются только переменные окружения. Порты открыты только на 127.0.0.1.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
